# JSON logs are not readable by WebPulse
server {
    server_name api.example.com;
    access_log /var/log/nginx/api.example.com.json json;
}

# nothing is logged
server {
    server_name quiet.example.com;
    access_log off;
}

# variables in the path: one file per host, not supported
server {
    server_name ~^(?<sub>.+)\.wild\.example\.com$ dyn.example.com;
    access_log /var/log/nginx/$host.access.log main;
}

# inherits the http-level log
server {
    listen 8080;
    server_name .shop.example.com;
}
