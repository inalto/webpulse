server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name blog.example.com www.blog.example.com;
    root /srv/blog/public;
    access_log /var/log/nginx/blog.example.com.access.log;
    ssl_certificate /etc/pki/tls/certs/blog.crt;
    ssl_certificate_key /etc/pki/tls/private/blog.key;

    location /static/ {
        access_log off;
    }
}
