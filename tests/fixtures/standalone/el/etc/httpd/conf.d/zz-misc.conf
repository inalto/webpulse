# a site whose requests go to the main server log
<VirtualHost *:80>
    ServerName nolog.example.org
    DocumentRoot /srv/nolog
</VirtualHost>

# piped logs cannot be tailed
<VirtualHost *:80>
    ServerName piped.example.org
    CustomLog "|/usr/sbin/rotatelogs /var/log/httpd/piped-%Y%m%d.log 86400" combined
</VirtualHost>

# a vhost format with a leading %v, and an incompatible one
LogFormat "%v %h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" vhostfmt
LogFormat "%h %t \"%r\" %>s" short
Define LOGS /var/log/httpd
<VirtualHost *:80>
    ServerName vhost.example.org
    CustomLog ${LOGS}/vhost.example.org.log vhostfmt
    CustomLog ${LOGS}/vhost.example.org-short.log short
</VirtualHost>
<VirtualHost *:80>
    ServerName short.example.org
    CustomLog ${LOGS}/short.example.org.log short
</VirtualHost>

# macro bodies are templates, not sites
<Macro VHost $name>
    <VirtualHost *:80>
        ServerName $name
        CustomLog /var/log/httpd/$name.log combined
    </VirtualHost>
</Macro>

# absolute includes below /etc/httpd are read relative to the configuration root
IncludeOptional /etc/httpd/sites/*.conf
