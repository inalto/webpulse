<VirtualHost *:80>
	ServerName example.org
	ServerAlias www.example.org
	ServerAdmin webmaster@example.org
	DocumentRoot /var/www/example.org
	ErrorLog ${APACHE_LOG_DIR}/example.org-error.log
	CustomLog ${APACHE_LOG_DIR}/example.org-access.log combined
	RewriteEngine on
	RewriteCond %{SERVER_NAME} =www.example.org [OR]
	RewriteCond %{SERVER_NAME} =example.org
	RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
	ServerName example.org
	ServerAlias www.example.org
	DocumentRoot /var/www/example.org
	ErrorLog ${APACHE_LOG_DIR}/example.org-ssl-error.log
	CustomLog ${APACHE_LOG_DIR}/example.org-ssl-access.log combined
	SSLEngine on
	SSLCertificateFile /etc/letsencrypt/live/example.org/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/example.org/privkey.pem
</VirtualHost>
</IfModule>
