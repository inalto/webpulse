name: Release

# Push a tag vX.Y.Z (X.Y.Z must equal the VERSION file and Cargo.toml) to build the
# static binaries and publish the GitHub release:
#   webpulse-<ver>-x86_64-unknown-linux-musl.tar.gz   (+ .sha256)
#   webpulse-<ver>-aarch64-unknown-linux-musl.tar.gz  (+ .sha256)
#   webpulse-<ver>.tar.gz                             (source, for install.sh --build)
#
# Supply-chain hardening:
#   - the workflow-wide token is read-only; only the `publish` job (which checks out
#     nothing and runs no repository code) gets `contents: write`, plus
#     `id-token: write` + `attestations: write` for the build-provenance attestation;
#   - every checkout uses `persist-credentials: false` (no token left in .git/config);
#   - every third-party action is pinned to a full commit SHA (the tag is in the comment);
#   - no build cache in the release workflow (a poisoned cache cannot reach a release).
# Verify a downloaded tarball with:
#   gh attestation verify webpulse-<ver>-<target>.tar.gz --repo <owner>/webpulse

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # pinned to a commit of the `stable` branch, so the toolchain must be named explicitly
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: mlugg/setup-zig@53fc45b17fe98b52f92ee5ea08ff48a85a3e7eb7 # v1.2.2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-zigbuild

      - name: Build and package
        env:
          WEBPULSE_RELEASE_TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) scripts/build_release.sh --zigbuild --target "$TARGET" --out dist

      - name: Smoke test (x86_64 runs natively)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          tar -xzf dist/webpulse-*-"$TARGET".tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP"/webpulse-*-"$TARGET"/bin/webpulse --version
          file "$RUNNER_TEMP"/webpulse-*-"$TARGET"/bin/webpulse | grep -q 'statically linked'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  source:
    name: source tarball
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Source tarball
        run: scripts/build_dist.sh dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-source
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish the release
    runs-on: ubuntu-latest
    needs: [build, source]
    # The only job with a write token. It does not check out or run repository code:
    # it verifies the checksums of what the build jobs produced, attests it and uploads it.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -c ./*.sha256
          ls -l

      - name: Build-provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "WebPulse ${TAG#v}" --generate-notes --verify-tag
          fi
          gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber
