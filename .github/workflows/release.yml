name: Release

# Push a tag vX.Y.Z (X.Y.Z must equal the VERSION file and Cargo.toml) to build the
# static binaries and publish the GitHub release:
#   webpulse-<ver>-x86_64-unknown-linux-musl.tar.gz   (+ .sha256)
#   webpulse-<ver>-aarch64-unknown-linux-musl.tar.gz  (+ .sha256)
#   webpulse-<ver>.tar.gz                             (source, for install.sh --build)

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build and package
        env:
          WEBPULSE_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) scripts/build_release.sh --zigbuild --target "${{ matrix.target }}" --out dist

      - name: Smoke test (x86_64 runs natively)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          tar -xzf dist/webpulse-*-${{ matrix.target }}.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP"/webpulse-*-${{ matrix.target }}/bin/webpulse --version
          file "$RUNNER_TEMP"/webpulse-*-${{ matrix.target }}/bin/webpulse | grep -q 'statically linked'

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish the release
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Source tarball
        run: scripts/build_dist.sh dist

      - name: Checksums
        run: |
          cd dist
          sha256sum -c ./*.sha256
          ls -l

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "WebPulse ${TAG#v}" --generate-notes
          fi
          gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber
