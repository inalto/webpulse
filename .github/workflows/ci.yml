name: CI

on:
  push:
    branches: [main, rust]
  pull_request:

# Third-party actions are pinned to full commit SHAs (tag in the comment); checkouts
# do not persist the token.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: cargo test (engine, web, packaging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # PHP runs only the cPanel LiveAPI shims under test (tests/pkg_frontends.rs, php -l in
      # tests/pkg_static.rs); without it those tests are skipped. The engine needs no PHP.
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: json, posix
          coverage: none

      - name: System tools
        run: sudo apt-get install -y --no-install-recommends sqlite3 jq shellcheck

      - name: cargo test
        run: cargo test --release

  parity:
    name: parity with the 0.1.0 PHP release
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the harness checks out tag v0.1.0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, json, mbstring, zlib, posix
          coverage: none
          ini-values: memory_limit=1G
      - name: System tools
        run: sudo apt-get install -y --no-install-recommends sqlite3 jq
      - name: Build
        run: cargo build --release
      - name: Parity harness
        run: tests/parity/run.sh # uses target/release/webpulse

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          sudo apt-get install -y --no-install-recommends shellcheck
          # whm/cgi/index.cgi is Perl: only the bash CGI is shell-checked
          shellcheck -S warning install.sh uninstall.sh installer/lib.sh hooks/*.sh scripts/*.sh whm/cgi/api.cgi
