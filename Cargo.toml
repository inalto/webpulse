[package]
name = "webpulse"
version = "0.2.1"
edition = "2024"
description = "Lightweight, log-based web analytics for cPanel & WHM: collector, CLI, JSON API and dashboard in one static binary"
license = "MIT"
repository = "https://github.com/inalto/webpulse"
homepage = "https://github.com/inalto/webpulse"
readme = "README.md"
keywords = ["analytics", "cpanel", "whm", "access-logs"]
categories = ["command-line-utilities", "web-programming"]
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
flate2 = "1.1.10"
libc = "0.2.190"
maxminddb = "0.32.0"
memchr = "2.8.3"
percent-encoding = "2.3.2"
rand = "0.10.3"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
foldhash = "0.2.0"
indexmap = { version = "2.14.2", features = ["serde"] }
thiserror = "2.0.21"
tiny_http = "0.12.0"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "gzip"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
